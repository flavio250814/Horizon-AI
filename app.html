<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App · Horizon AI</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b14;
      --panel: #0c1220;
      --soft: #111827;
      --text: #f3f6fb;
      --muted: #8b9bb8;
      --line: rgba(255,255,255,0.08);
      --blue: #3b82f6;
      --cyan: #22d3ee;
      --danger: #f43f5e;
      --grad: linear-gradient(135deg, #3b82f6, #06b6d4);
      --user-bg: rgba(59,130,246,0.18);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; overflow: hidden;
    }

    /* AUTH */
    #auth {
      min-height: 100vh; display:flex; align-items:center; justify-content:center;
      padding: 1.5rem;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(59,130,246,0.18), transparent);
    }
    #auth.hidden { display:none; }
    .auth-card {
      width: 100%; max-width: 380px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px; padding: 2rem 1.6rem;
    }
    .auth-logo {
      display:flex; align-items:center; justify-content:center; gap:10px;
      margin-bottom: 0.4rem;
    }
    .auth-logo img { height: 36px; border-radius: 8px; }
    .auth-logo span {
      font-weight: 700; font-size: 1.15rem;
      background: var(--grad);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .auth-sub { text-align:center; color:var(--muted); font-size:0.85rem; margin-bottom:1.4rem; }
    .tabs {
      display:flex; gap:4px; background:var(--soft); border-radius:10px; padding:3px; margin-bottom:1.2rem;
    }
    .tab {
      flex:1; border:none; background:transparent; color:var(--muted);
      padding:0.55rem; border-radius:8px; font:inherit; font-weight:600; font-size:0.85rem; cursor:pointer;
    }
    .tab.on { background:var(--grad); color:#fff; }
    .field { margin-bottom:0.85rem; }
    .field label { display:block; font-size:0.75rem; color:var(--muted); margin-bottom:0.3rem; }
    .field input {
      width:100%; padding:0.75rem 0.9rem;
      background:var(--soft); border:1px solid var(--line); border-radius:10px;
      color:var(--text); font:inherit; font-size:0.9rem; outline:none;
    }
    .field input:focus { border-color: rgba(59,130,246,0.5); }
    .pass-wrap { position:relative; }
    .pass-wrap input { padding-right:2.8rem; }
    .btn-lock {
      position:absolute; right:8px; top:50%; transform:translateY(-50%);
      width:32px; height:32px; border:none; border-radius:8px;
      background:transparent; color:var(--muted); cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .btn-lock svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; }
    .auth-msg {
      display:none; font-size:0.8rem; padding:0.55rem 0.75rem; border-radius:8px; margin-bottom:0.85rem;
    }
    .auth-msg.show { display:block; }
    .auth-msg.err { background:rgba(244,63,94,0.12); color:var(--danger); border:1px solid rgba(244,63,94,0.25); }
    .auth-msg.ok { background:rgba(34,211,238,0.1); color:var(--cyan); border:1px solid rgba(34,211,238,0.2); }
    .btn-auth {
      width:100%; padding:0.8rem; border:none; border-radius:10px;
      background:var(--grad); color:#fff; font:inherit; font-weight:600; cursor:pointer;
    }
    .auth-link {
      display:block; width:100%; margin-top:0.75rem; background:none; border:none;
      color:var(--muted); font:inherit; font-size:0.75rem; cursor:pointer; text-decoration:underline;
    }
    .auth-foot { text-align:center; margin-top:1rem; font-size:0.72rem; color:var(--muted); opacity:0.7; }
    .auth-foot a { color:var(--cyan); text-decoration:none; }

    /* APP */
    #app { display:none; height:100vh; flex-direction:column; }
    #app.on { display:flex; }

    .top {
      height:56px; flex-shrink:0;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 1rem; border-bottom:1px solid var(--line);
      background:rgba(7,11,20,0.9); backdrop-filter:blur(10px);
    }
    .top-left { display:flex; align-items:center; gap:10px; }
    .btn-menu {
      display:none; background:none; border:none; color:var(--muted);
      font-size:1.25rem; cursor:pointer; padding:4px 8px;
    }
    .top-brand { display:flex; align-items:center; gap:8px; font-weight:600; font-size:0.95rem; text-decoration:none; color:var(--text); }
    .top-brand img { height:26px; border-radius:6px; }
    .status {
      font-size:0.72rem; padding:0.25rem 0.6rem; border-radius:999px;
      border:1px solid var(--line); color:var(--muted);
    }
    .status.on { color:#4ade80; border-color:rgba(74,222,128,0.3); background:rgba(74,222,128,0.08); }
    .status.off { color:#fbbf24; border-color:rgba(251,191,36,0.3); background:rgba(251,191,36,0.08); }
    .top-right { display:flex; gap:0.4rem; align-items:center; }
    .btn-h {
      padding:0.4rem 0.75rem; border-radius:8px; border:1px solid var(--line);
      background:transparent; color:var(--muted); font:inherit; font-size:0.8rem; font-weight:500; cursor:pointer;
    }
    .btn-h:hover { color:var(--text); border-color:rgba(255,255,255,0.15); }
    .btn-h.danger { color:var(--danger); border-color:rgba(244,63,94,0.3); }

    .body { flex:1; display:flex; overflow:hidden; }
    .side {
      width:260px; flex-shrink:0;
      background:var(--panel); border-right:1px solid var(--line);
      display:flex; flex-direction:column;
    }
    .side-top { padding:0.9rem; border-bottom:1px solid var(--line); }
    .btn-new {
      width:100%; padding:0.65rem; border:none; border-radius:10px;
      background:var(--grad); color:#fff; font:inherit; font-weight:600; font-size:0.85rem; cursor:pointer;
    }
    .convs { flex:1; overflow-y:auto; padding:0.6rem; }
    .conv {
      display:flex; align-items:center; gap:6px;
      padding:0.55rem 0.6rem; border-radius:8px; margin-bottom:2px;
    }
    .conv:hover, .conv.active { background:rgba(255,255,255,0.05); }
    .conv-title {
      flex:1; min-width:0; font-size:0.85rem; color:var(--muted);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer;
    }
    .conv.active .conv-title { color:var(--text); }
    .btn-del {
      width:26px; height:26px; border:none; border-radius:6px;
      background:transparent; color:var(--muted); cursor:pointer; opacity:0.4; font-size:0.8rem;
    }
    .conv:hover .btn-del { opacity:1; }
    .btn-del:hover { color:var(--danger); background:rgba(244,63,94,0.12); }
    .side-foot {
      padding:0.85rem; border-top:1px solid var(--line);
      font-size:0.72rem; color:var(--muted); text-align:center;
    }

    .chat { flex:1; display:flex; flex-direction:column; min-width:0; }
    .msgs {
      flex:1; overflow-y:auto; padding:1.25rem 1.25rem 0.5rem;
      display:flex; flex-direction:column; gap:1rem;
    }
    .msg {
      display:flex; gap:10px; width:100%; align-items:flex-end;
      animation: in 0.3s ease both;
    }
    @keyframes in {
      from { opacity:0; transform:translateY(6px); }
      to { opacity:1; transform:none; }
    }
    .msg.bot { justify-content:flex-start; padding-right:clamp(1rem,20vw,12rem); }
    .msg.user { justify-content:flex-end; flex-direction:row-reverse; padding-left:clamp(1rem,20vw,12rem); }
    .av {
      width:30px; height:30px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:0.75rem; font-weight:700;
    }
    .msg.user .av { background:rgba(59,130,246,0.2); color:var(--blue); }
    .msg.bot .av { background:var(--grad); color:#fff; font-size:0.65rem; }
    .bubble {
      max-width:100%;
      font-size:0.95rem; line-height:1.6;
      padding:0.7rem 1rem; border-radius:16px;
      word-wrap:break-word;
    }
    .msg.user .bubble {
      background:var(--user-bg);
      border:1px solid rgba(59,130,246,0.25);
      border-radius:16px 16px 4px 16px;
      white-space:pre-wrap; color:var(--text);
    }
    .msg.bot .bubble {
      background:rgba(255,255,255,0.04);
      border:1px solid var(--line);
      border-radius:16px 16px 16px 4px;
    }
    .bubble a { color:var(--cyan); }
    .bubble code {
      font-family:ui-monospace,monospace; font-size:0.86em;
      background:rgba(59,130,246,0.12); padding:0.1em 0.35em; border-radius:4px; color:var(--cyan);
    }
    .bubble pre {
      background:var(--soft); border:1px solid var(--line);
      border-radius:10px; padding:0.75rem; overflow-x:auto; margin:0.5rem 0;
    }
    .bubble pre code { background:none; color:var(--text); }
    .bubble strong { font-weight:600; }
    .bubble p { margin:0 0 0.6rem; }
    .bubble p:last-child { margin:0; }
    .bubble .err { color:var(--danger); }
    .bubble img.gen {
      display:block; max-width:min(400px,100%); border-radius:12px;
      margin-top:0.5rem; border:1px solid var(--line);
    }

    .welcome {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center; padding:2rem; max-width:560px; margin:0 auto;
    }
    .welcome h2 { font-size:1.5rem; font-weight:700; margin-bottom:0.4rem; }
    .welcome h2 span {
      background:var(--grad);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .welcome p { color:var(--muted); margin-bottom:1.75rem; font-size:0.95rem; }
    .sugs { display:grid; grid-template-columns:1fr 1fr; gap:0.65rem; width:100%; }
    .sug {
      text-align:left; padding:0.9rem 1rem;
      background:rgba(255,255,255,0.03); border:1px solid var(--line);
      border-radius:12px; cursor:pointer; color:var(--text); font:inherit;
    }
    .sug:hover { border-color:rgba(59,130,246,0.4); }
    .sug strong { display:block; font-size:0.85rem; margin-bottom:0.2rem; }
    .sug span { font-size:0.78rem; color:var(--muted); }

    .composer {
      padding:0.85rem 1.25rem 1.15rem; flex-shrink:0;
    }
    .box {
      max-width:820px; margin:0 auto;
      display:flex; gap:0.5rem; align-items:flex-end;
      background:var(--panel); border:1px solid var(--line);
      border-radius:14px; padding:0.5rem 0.55rem 0.5rem 0.9rem;
    }
    .box:focus-within { border-color:rgba(59,130,246,0.45); }
    .box textarea {
      flex:1; background:none; border:none; outline:none; color:var(--text);
      font:inherit; font-size:0.95rem; resize:none; max-height:140px;
      line-height:1.5; padding:0.45rem 0;
    }
    .box textarea::placeholder { color:var(--muted); opacity:0.7; }
    .btn-send {
      width:40px; height:40px; border-radius:10px; border:none;
      background:var(--grad); color:#fff; cursor:pointer;
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .btn-send:disabled { opacity:0.4; cursor:not-allowed; }
    .btn-send svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; }
    .hint { text-align:center; font-size:0.7rem; color:var(--muted); margin-top:0.5rem; opacity:0.75; }

    .typing { display:flex; gap:4px; padding:2px 0; }
    .typing i {
      width:6px; height:6px; border-radius:50%; background:var(--cyan);
      animation: bounce 1.2s infinite;
    }
    .typing i:nth-child(2) { animation-delay:0.15s; }
    .typing i:nth-child(3) { animation-delay:0.3s; }
    @keyframes bounce {
      0%,60%,100% { transform:translateY(0); opacity:0.4; }
      30% { transform:translateY(-4px); opacity:1; }
    }

    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:40; }
    .overlay.on { display:block; }

    @media (max-width:768px) {
      .btn-menu { display:block; }
      .side {
        position:fixed; left:0; top:0; bottom:0; z-index:50;
        transform:translateX(-100%); transition:transform 0.25s;
      }
      .side.open { transform:none; }
      .sugs { grid-template-columns:1fr; }
      .msg.bot, .msg.user { padding-left:0; padding-right:0; }
    }
  </style>
</head>
<body>

<div id="auth">
  <div class="auth-card">
    <div class="auth-logo"><img src="logo.png" alt=""><span>Horizon AI</span></div>
    <p class="auth-sub">Entre ou crie sua conta</p>
    <div class="tabs">
      <button type="button" class="tab on" id="tab-login" onclick="tab('login')">Entrar</button>
      <button type="button" class="tab" id="tab-reg" onclick="tab('reg')">Criar conta</button>
    </div>
    <div class="auth-msg" id="auth-msg"></div>
    <div id="form-login">
      <div class="field"><label>Usuário</label><input type="text" id="login-user" autocomplete="username"></div>
      <div class="field">
        <label>Senha</label>
        <div class="pass-wrap">
          <input type="password" id="login-pass" autocomplete="current-password">
          <button type="button" class="btn-lock" onclick="togglePass('login-pass',this)" aria-label="Senha">
            <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          </button>
        </div>
      </div>
      <button type="button" class="btn-auth" onclick="login()">Entrar</button>
    </div>
    <div id="form-reg" style="display:none">
      <div class="field"><label>Nome</label><input type="text" id="reg-nome"></div>
      <div class="field"><label>Usuário</label><input type="text" id="reg-user"></div>
      <div class="field">
        <label>Senha</label>
        <div class="pass-wrap">
          <input type="password" id="reg-pass" autocomplete="new-password">
          <button type="button" class="btn-lock" onclick="togglePass('reg-pass',this)" aria-label="Senha">
            <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          </button>
        </div>
      </div>
      <div class="field"><label>Confirmar senha</label><input type="password" id="reg-pass2"></div>
      <button type="button" class="btn-auth" onclick="register()">Criar conta</button>
    </div>
    <button type="button" class="auth-link" onclick="clearUsers()">Limpar contas deste navegador</button>
    <p class="auth-foot"><a href="index.html">← Voltar ao início</a></p>
  </div>
</div>

<div id="app">
  <div class="overlay" id="overlay" onclick="closeSide()"></div>
  <header class="top">
    <div class="top-left">
      <button class="btn-menu" onclick="openSide()">☰</button>
      <a class="top-brand" href="index.html"><img src="logo.png" alt=""><span>Horizon AI</span></a>
      <span class="status off" id="ollama-status">Ollama</span>
    </div>
    <div class="top-right">
      <button class="btn-h" onclick="nova()">Nova</button>
      <button class="btn-h danger" onclick="logout()">Sair</button>
    </div>
  </header>
  <div class="body">
    <aside class="side" id="side">
      <div class="side-top"><button class="btn-new" onclick="nova(); closeSide();">Nova conversa</button></div>
      <div class="convs" id="convs"></div>
      <div class="side-foot">Beyond the Horizon</div>
    </aside>
    <div class="chat">
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <div class="box">
          <textarea id="input" rows="1" placeholder="Mensagem..." onkeydown="onKey(e)" oninput="grow(this)"></textarea>
          <button class="btn-send" id="send" onclick="send()" aria-label="Enviar">
            <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
          </button>
        </div>
        <div class="hint">Horizon AI · Ollama local · pode errar</div>
      </div>
    </div>
  </div>
</div>

<script>
  const OLLAMA_URL = 'http://localhost:11434/api/chat';
  const OLLAMA_MODEL = 'qwen2.5:7b';
  const SU = 'horizon_ai_users_v2';
  const SS = 'horizon_ai_session_v2';
  const SYSTEM = 'Você é a Horizon AI, assistente da Beyond the Horizon. Seja clara e objetiva. Use Markdown quando ajudar. Responda em português do Brasil.';

  let user = null, chats = [], current = null, busy = false;

  function sha256(str) {
    function rotr(n,x){return (x>>>n)|(x<<(32-n));}
    function ch(x,y,z){return (x&y)^(~x&z);}
    function maj(x,y,z){return (x&y)^(x&z)^(y&z);}
    function b0(x){return rotr(2,x)^rotr(13,x)^rotr(22,x);}
    function b1(x){return rotr(6,x)^rotr(11,x)^rotr(25,x);}
    function s0(x){return rotr(7,x)^rotr(18,x)^(x>>>3);}
    function s1(x){return rotr(17,x)^rotr(19,x)^(x>>>10);}
    const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    const utf8=unescape(encodeURIComponent(str));
    const bytes=[]; for(let i=0;i<utf8.length;i++) bytes.push(utf8.charCodeAt(i));
    const bitLen=bytes.length*8; bytes.push(0x80);
    while((bytes.length%64)!==56) bytes.push(0);
    for(let i=7;i>=0;i--) bytes.push((bitLen/Math.pow(2,8*i))&0xff);
    let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    for(let i=0;i<bytes.length;i+=64){
      const w=new Array(64);
      for(let t=0;t<16;t++) w[t]=(bytes[i+t*4]<<24)|(bytes[i+t*4+1]<<16)|(bytes[i+t*4+2]<<8)|bytes[i+t*4+3];
      for(let t=16;t<64;t++) w[t]=(s1(w[t-2])+w[t-7]+s0(w[t-15])+w[t-16])>>>0;
      let [a,b,c,d,e,f,g,h]=H;
      for(let t=0;t<64;t++){
        const t1=(h+b1(e)+ch(e,f,g)+K[t]+w[t])>>>0;
        const t2=(b0(a)+maj(a,b,c))>>>0;
        h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
      }
      H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;
      H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
    }
    return H.map(x=>('00000000'+x.toString(16)).slice(-8)).join('');
  }
  function hash(pass, salt){ return sha256(salt+'::'+pass); }
  function salt(){ let s=''; for(let i=0;i<32;i++) s+=Math.floor(Math.random()*16).toString(16); return s; }
  function users(){ try{ const a=JSON.parse(localStorage.getItem(SU)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
  function saveUsers(a){ localStorage.setItem(SU, JSON.stringify(a)); }
  function convKey(){ return 'horizon_ai_conv_v2_'+(user?user.id:'g'); }
  function esc(t){ const d=document.createElement('div'); d.textContent=t==null?'':String(t); return d.innerHTML; }

  function msgAuth(t, ok){
    const el=document.getElementById('auth-msg');
    el.textContent=t; el.className='auth-msg show '+(ok?'ok':'err');
  }
  function tab(which){
    document.getElementById('auth-msg').className='auth-msg';
    document.getElementById('tab-login').classList.toggle('on', which==='login');
    document.getElementById('tab-reg').classList.toggle('on', which==='reg');
    document.getElementById('form-login').style.display=which==='login'?'block':'none';
    document.getElementById('form-reg').style.display=which==='reg'?'block':'none';
  }
  function togglePass(id, btn){
    const i=document.getElementById(id);
    i.type=i.type==='password'?'text':'password';
  }
  function clearUsers(){
    if(!confirm('Apagar contas deste navegador?')) return;
    localStorage.removeItem(SU); sessionStorage.removeItem(SS);
    msgAuth('Contas apagadas.', true); tab('reg');
  }
  function register(){
    const nome=document.getElementById('reg-nome').value.trim();
    const u=document.getElementById('reg-user').value.trim().toLowerCase().replace(/\s+/g,'');
    const p=document.getElementById('reg-pass').value;
    const p2=document.getElementById('reg-pass2').value;
    if(nome.length<2) return msgAuth('Informe o nome.');
    if(u.length<3) return msgAuth('Usuário: mín. 3 caracteres.');
    if(p.length<6) return msgAuth('Senha: mín. 6 caracteres.');
    if(p!==p2) return msgAuth('Senhas não coincidem.');
    const list=users();
    if(list.some(x=>x.user===u)) return msgAuth('Usuário já existe.');
    const s=salt();
    const novo={ id:'u_'+Date.now(), nome, user:u, salt:s, hash:hash(p,s) };
    list.push(novo); saveUsers(list);
    sessionStorage.setItem(SS, JSON.stringify({id:novo.id,nome,user:u}));
    enter(novo);
  }
  function login(){
    const u=document.getElementById('login-user').value.trim().toLowerCase().replace(/\s+/g,'');
    const p=document.getElementById('login-pass').value;
    if(!u||!p) return msgAuth('Preencha usuário e senha.');
    const list=users();
    if(!list.length) return msgAuth('Nenhuma conta. Crie uma.');
    const found=list.find(x=>x.user===u);
    if(!found) return msgAuth('Usuário não encontrado.');
    if(hash(p,found.salt)!==found.hash) return msgAuth('Senha incorreta.');
    sessionStorage.setItem(SS, JSON.stringify({id:found.id,nome:found.nome,user:found.user}));
    enter(found);
  }
  function logout(){
    sessionStorage.removeItem(SS);
    user=null; chats=[]; current=null;
    document.getElementById('app').classList.remove('on');
    document.getElementById('auth').classList.remove('hidden');
  }
  function enter(u){
    user={id:u.id,nome:u.nome,user:u.user};
    document.getElementById('auth').classList.add('hidden');
    document.getElementById('app').classList.add('on');
    try{ chats=JSON.parse(localStorage.getItem(convKey())||'[]'); if(!Array.isArray(chats)) chats=[]; }catch(e){ chats=[]; }
    nova();
    checkOllama();
    document.getElementById('input').focus();
  }
  function boot(){
    try{
      const s=JSON.parse(sessionStorage.getItem(SS)||'null');
      if(s&&s.id){ const u=users().find(x=>x.id===s.id); if(u){ enter(u); return; } }
    }catch(e){}
  }

  async function checkOllama(){
    const el=document.getElementById('ollama-status');
    try{
      const r=await fetch('http://localhost:11434/api/tags');
      if(r.ok){ el.textContent='Ollama online'; el.className='status on'; return; }
    }catch(e){}
    el.textContent='Ollama offline'; el.className='status off';
  }

  function openSide(){ document.getElementById('side').classList.add('open'); document.getElementById('overlay').classList.add('on'); }
  function closeSide(){ document.getElementById('side').classList.remove('open'); document.getElementById('overlay').classList.remove('on'); }
  function grow(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,140)+'px'; }
  function onKey(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } }
  function save(){ localStorage.setItem(convKey(), JSON.stringify(chats)); }

  function md(src){
    if(!src) return '';
    let t=String(src).replace(/\r\n/g,'\n');
    const blocks=[]; const saveB=h=>{ const i=blocks.length; blocks.push(h); return '%%B'+i+'%%'; };
    t=t.replace(/```[\s\S]*?```/g,m=>saveB('<pre><code>'+esc(m.replace(/^```\w*\n?/,'').replace(/```$/,''))+'</code></pre>'));
    t=t.replace(/`([^`\n]+)`/g,(_,c)=>saveB('<code>'+esc(c)+'</code>'));
    t=esc(t);
    t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    t=t.replace(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g,'<img class="gen" src="$2" alt="$1">');
    t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    t=t.split(/\n{2,}/).map(b=>{
      b=b.trim(); if(!b) return '';
      if(/^<(pre|h)/.test(b)||/^%%B\d+%%$/.test(b)) return b;
      return '<p>'+b.replace(/\n/g,'<br>')+'</p>';
    }).join('');
    return t.replace(/%%B(\d+)%%/g,(_,i)=>blocks[+i]||'');
  }

  function nova(){
    current=null;
    const n=user?esc(user.nome.split(' ')[0]):'';
    document.getElementById('msgs').innerHTML=
      '<div class="welcome" id="welcome">'+
      '<h2>Olá'+(n?', '+n:'')+'. Eu sou a <span>Horizon AI</span>.</h2>'+
      '<p>Como posso ajudar?</p>'+
      '<div class="sugs">'+
      '<button class="sug" onclick="useSug(\'Me ajuda a escrever um texto profissional\')"><strong>Escrever</strong><span>Texto profissional</span></button>'+
      '<button class="sug" onclick="useSug(\'Explica inteligência artificial de forma simples\')"><strong>Explicar</strong><span>Qualquer assunto</span></button>'+
      '<button class="sug" onclick="useSug(\'Organiza um plano de produto de tecnologia\')"><strong>Planejar</strong><span>Projetos</span></button>'+
      '<button class="sug" onclick="useSug(\'Gera ideias de conteúdo para redes sociais de tech\')"><strong>Ideias</strong><span>Conteúdo</span></button>'+
      '</div></div>';
    listChats();
    document.getElementById('input').focus();
  }
  function useSug(t){ document.getElementById('input').value=t; send(); }
  function listChats(){
    const el=document.getElementById('convs');
    if(!chats.length){ el.innerHTML='<div style="padding:1rem;color:var(--muted);font-size:0.8rem;text-align:center">Nenhuma conversa</div>'; return; }
    el.innerHTML=chats.map(c=>
      '<div class="conv '+(c.id===current?'active':'')+'">'+
      '<div class="conv-title" onclick="openChat(\''+c.id+'\')">'+esc(c.titulo||'Conversa')+'</div>'+
      '<button class="btn-del" onclick="delChat(\''+c.id+'\',event)">×</button></div>'
    ).join('');
  }
  function delChat(id,e){
    if(e){ e.stopPropagation(); e.preventDefault(); }
    if(!confirm('Excluir conversa?')) return;
    chats=chats.filter(c=>c.id!==id); save();
    if(current===id) nova(); else listChats();
  }
  function openChat(id){
    const c=chats.find(x=>x.id===id); if(!c) return;
    current=id;
    const box=document.getElementById('msgs'); box.innerHTML='';
    c.mensagens.forEach(m=>append(m.role,m.text,false));
    listChats(); closeSide(); box.scrollTop=box.scrollHeight;
  }
  function append(role, text, anim, isErr){
    const w=document.getElementById('welcome'); if(w) w.remove();
    const box=document.getElementById('msgs');
    const div=document.createElement('div');
    div.className='msg '+role;
    if(anim===false) div.style.animation='none';
    let inner;
    if(isErr) inner='<div class="bubble"><span class="err">'+esc(text)+'</span></div>';
    else if(role==='bot') inner='<div class="bubble">'+md(text)+'</div>';
    else inner='<div class="bubble">'+esc(text)+'</div>';
    div.innerHTML='<div class="av">'+(role==='user'?'V':'H')+'</div><div>'+inner+'</div>';
    box.appendChild(div); box.scrollTop=box.scrollHeight;
  }
  function typing(){
    const box=document.getElementById('msgs');
    const div=document.createElement('div');
    div.className='msg bot'; div.id='typing';
    div.innerHTML='<div class="av">H</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';
    box.appendChild(div); box.scrollTop=box.scrollHeight;
  }
  function stopTyping(){ const t=document.getElementById('typing'); if(t) t.remove(); }

  async function callOllama(hist){
    const messages=[{role:'system',content:SYSTEM}];
    hist.forEach(m=>messages.push({role:m.role==='bot'?'assistant':'user',content:m.text}));
    let res;
    try{
      res=await fetch(OLLAMA_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:OLLAMA_MODEL,messages,stream:false,options:{temperature:0.7}})
      });
    }catch(e){
      throw new Error('Ollama offline. Abra o Ollama e use este site em localhost (Live Server).');
    }
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error||('HTTP '+res.status));
    const c=data.message&&data.message.content;
    if(!c) throw new Error('Resposta vazia. Rode: ollama pull qwen2.5:7b');
    return String(c).trim();
  }

  async function send(){
    if(busy||!user) return;
    const input=document.getElementById('input');
    const text=input.value.trim();
    if(!text) return;
    input.value=''; input.style.height='auto';
    busy=true; document.getElementById('send').disabled=true;
    if(!current){
      current='c_'+Date.now();
      chats.unshift({id:current,titulo:text.slice(0,40)+(text.length>40?'…':''),mensagens:[]});
    }
    const conv=chats.find(c=>c.id===current);
    conv.mensagens.push({role:'user',text});
    append('user',text); save(); listChats(); typing();
    try{
      const ans=await callOllama(conv.mensagens);
      stopTyping(); append('bot',ans);
      conv.mensagens.push({role:'bot',text:ans}); save();
    }catch(err){
      stopTyping();
      append('bot', err.message||'Erro', true, true);
    }
    busy=false; document.getElementById('send').disabled=false;
    input.focus(); checkOllama();
  }

  document.getElementById('login-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
  document.getElementById('reg-pass2').addEventListener('keydown',e=>{ if(e.key==='Enter') register(); });
  // fix onkeydown
  document.getElementById('input').onkeydown=function(e){ onKey(e); };
  boot();
</script>
